name: patch-r-deps

on:
  push:
    paths:
      - '.github/workflows/patch-r-deps.yml'

permissions:
  contents: write

jobs:
  patch:
    name: rewrite one step of conformance.yml into ops/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Replace exactly one line
        run: |
          mkdir -p ops
          cat > /tmp/new.txt <<'NEW'
          Rscript - <<'R'
          pkgs <- c("jsonlite", "sandwich", "AER", "plm", "urca")
          repos <- unique(c(getOption("repos"), "https://cloud.r-project.org"))
          install.packages(pkgs, repos = repos)
          loads <- function(p) requireNamespace(p, quietly = TRUE)
          missing <- pkgs[!vapply(pkgs, loads, logical(1))]
          for (p in missing) {
            cat(sprintf("%s did not load after the binary install, retrying from source\n", p))
            try(install.packages(p, repos = "https://cloud.r-project.org", type = "source"))
          }
          missing <- pkgs[!vapply(pkgs, loads, logical(1))]
          if (length(missing)) {
            cat(sprintf("::error title=R dependency unusable::%s installed without reporting an error but cannot be loaded, so the R adapter would have failed several steps later with a misleading message\n", paste(missing, collapse = ", ")))
            quit(status = 1)
          }
          cat(sprintf("every R dependency loads: %s\n", paste(pkgs, collapse = ", ")))
          R
          NEW
          python3 - <<'PY'
          import hashlib
          path = ".github/workflows/conformance.yml"
          old = "          Rscript -e 'install.packages(c(\"jsonlite\",\"sandwich\",\"AER\",\"plm\",\"urca\"))'\n"
          src = open(path, encoding="utf-8").read()
          hits = src.count(old)
          if hits != 1:
              raise SystemExit("expected exactly 1 hit, found %d" % hits)
          body = open("/tmp/new.txt", encoding="utf-8").read()
          new = "".join("          " + line if line.strip() else line
                        for line in body.splitlines(keepends=True))
          out = src.replace(old, new)
          data = out.encode("utf-8")
          open("ops/conformance.patched.yml", "wb").write(data)
          blob = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          print("::error title=Patched file::bytes %d -> %d, blob %s" % (len(src), len(data), blob))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/conformance.patched.yml
          git commit -m "ops: patched conformance.yml awaiting promotion into .github/workflows"
          git push
