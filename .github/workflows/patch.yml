name: apply the one time patch

on:
  repository_dispatch:
    types: [apply-patch]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Apply
        run: python tools/patch_econospec.py
      - name: Regenerate the specifications with the patched generator
        run: |
          pip install numpy==2.1.3
          python tools/make_specs.py
          git diff --exit-code specs
      - name: Remove the scaffolding and commit
        run: |
          rm tools/patch_econospec.py
          rm .github/workflows/patch.yml
          rm .github/workflows/forensics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply the tolerance and invariant patch, remove the scaffolding"
          git push
