name: repair

on:
  workflow_dispatch:
  repository_dispatch:
    types: [repair-dash-guard]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Repair the long dash guard
        run: python tools/repair_dash_guard.py

      - name: Remove the one time repair script and its workflow
        run: |
          rm tools/repair_dash_guard.py
          rm .github/workflows/repair.yml

      - name: Commit the repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair the long dash guard and drop the repair scaffolding'
          git push
