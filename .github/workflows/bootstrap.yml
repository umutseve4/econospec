name: bootstrap generated artifacts

# The specifications, the fixtures and the golden manifest are all produced by
# deterministic code that lives in this repository. Rather than trusting a
# hand transferred copy of a few hundred kilobytes, this workflow regenerates
# them on a clean runner and commits the result once.
#
# The committed fixtures/manifest.json is the independent check: it was written
# on a different machine before this workflow ever ran, and gen_fixtures.py
# --check compares every regenerated CSV against it byte for byte. If the
# generators are not deterministic across machines, this job fails instead of
# committing something that only reproduces in one place.

on:
  repository_dispatch:
    types: [bootstrap-artifacts]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install numpy only
        run: pip install numpy==2.1.3

      - name: Keep the transferred manifest out of reach of the generator
        run: cp fixtures/manifest.json /tmp/transferred-manifest.json

      - name: Generate fixtures
        run: python tools/gen_fixtures.py

      - name: Regenerated checksums must equal the transferred ones
        run: |
          python - <<'PY'
          import json, sys
          transferred = json.load(open("/tmp/transferred-manifest.json"))
          regenerated = json.load(open("fixtures/manifest.json"))
          if transferred == regenerated:
              print("manifest reproduced exactly on a clean runner")
              sys.exit(0)
          names = sorted(set(transferred) | set(regenerated))
          for name in names:
              a = transferred.get(name, {}).get("sha256")
              b = regenerated.get(name, {}).get("sha256")
              if a != b:
                  print("DRIFT %s transferred=%s regenerated=%s" % (name, a, b))
          sys.exit(1)
          PY

      - name: Fixtures on disk must match their generators
        run: python tools/gen_fixtures.py --check

      - name: Generate specifications
        run: python tools/make_specs.py

      - name: Generate the golden manifest
        run: python tools/run_reference.py --golden --quiet

      - name: Show what will be committed
        run: |
          python - <<'PY'
          import hashlib, glob, os
          for pattern in ["fixtures/*.csv", "specs/*/*.json", "fixtures/golden/*.json"]:
              for path in sorted(glob.glob(pattern)):
                  data = open(path, "rb").read()
                  print("%s  %8d  %s" % (hashlib.sha256(data).hexdigest()[:16], len(data), path))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures specs
          if git diff --cached --quiet; then
            echo "nothing to commit, artifacts already current"
            exit 0
          fi
          git commit -m "Generate fixtures, specifications and golden manifest on a clean runner"
          git push
