name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: reference, python and r must agree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("jsonlite","sandwich","AER","plm","urca"))'

      - name: Fixtures must match their generators byte for byte
        run: python tools/gen_fixtures.py --check

      - name: Unit and mutation tests
        run: pytest -q tests

      - name: Reference kernel
        run: python tools/run_reference.py --quiet

      - name: Golden manifest must not have drifted
        run: |
          python - <<'PY'
          import json, glob, os, sys
          bad = []
          for path in sorted(glob.glob("results/reference/*.json")):
              name = os.path.basename(path)
              if name == "environment.json":
                  continue
              golden = os.path.join("fixtures/golden", name)
              if json.load(open(path)) != json.load(open(golden)):
                  bad.append(name)
          if bad:
              print("reference output no longer matches the committed golden manifest:")
              for name in bad:
                  print("  " + name)
              sys.exit(1)
          print("golden manifest is current")
          PY

      - name: Python adapter (statsmodels, linearmodels)
        run: python adapters/python/run_statsmodels.py --out results/python-statsmodels

      - name: R adapter (lm, sandwich, AER, plm, urca)
        run: Rscript adapters/r/run_r.R --out results/r

      - name: Compare every adapter against the golden manifest
        run: |
          python tools/compare_results.py \
            --require reference python-statsmodels r

      - name: Build the Conformance Observatory
        if: always()
        run: python tools/build_report.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: conformance-evidence
          path: |
            results/
            site/
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  readme-claims:
    name: the README may only claim what the policy promises
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read the published site policy
        id: policy
        run: |
          set -u
          file=.github/pages-policy
          test -f "$file" || {
            echo "::error title=Policy file missing::$file states whether a published site is promised and every publish decision reads it"
            exit 1
          }
          value=$(grep -E '^PAGES_REQUIRED=' "$file" | tail -n 1 | cut -d= -f2 | tr -d '[:space:]')
          case "$value" in
            true|false)
              echo "required=$value" >> "$GITHUB_OUTPUT"
              echo "PAGES_REQUIRED=$value"
              ;;
            *)
              echo "::error title=Policy unreadable::PAGES_REQUIRED must be exactly true or false, found '$value'"
              exit 1
              ;;
          esac

      - name: The README and the policy must say the same thing
        env:
          REQUIRED: ${{ steps.policy.outputs.required }}
        run: |
          set -u
          claims=$(grep -c -E 'observatory-live|umutseve4\.github\.io/econospec|github\.io/econospec' README.md || true)
          echo "claims of a published address in README.md: $claims"
          if [ "$REQUIRED" = "false" ] && [ "$claims" -gt 0 ]; then
            echo "::error title=README overclaims::the policy promises no published site, so the README may not link or badge one. Found $claims reference(s)."
            exit 1
          fi
          if [ "$REQUIRED" = "true" ] && [ "$claims" -eq 0 ]; then
            echo "::error title=README underclaims::the policy promises a published site and the README does not link it, so a lost deployment would be invisible to a reader"
            exit 1
          fi
          echo "the README matches the policy" >> "$GITHUB_STEP_SUMMARY"
          echo "This check never touches the network, so it produces the same verdict on a pull request and on main." >> "$GITHUB_STEP_SUMMARY"

  pages-preflight:
    name: is a Pages site configured
    needs: [conformance, readme-claims]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read the published site policy
        id: policy
        run: |
          set -u
          value=$(grep -E '^PAGES_REQUIRED=' .github/pages-policy | tail -n 1 | cut -d= -f2 | tr -d '[:space:]')
          echo "required=$value" >> "$GITHUB_OUTPUT"
          echo "PAGES_REQUIRED=$value"

      - name: Ask the Pages API whether a site exists
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED: ${{ steps.policy.outputs.required }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "the Pages API answered HTTP $code"
          case "$code" in
            200)
              echo "configured=true" >> "$GITHUB_OUTPUT"
              echo "Pages is configured, so the observatory will be published for this commit." >> "$GITHUB_STEP_SUMMARY"
              if [ "$REQUIRED" = "false" ]; then
                echo "::notice title=Policy is behind reality::a Pages site exists while .github/pages-policy still says PAGES_REQUIRED=false. Set it to true so a lost deployment fails the run instead of skipping quietly."
              fi
              ;;
            404)
              echo "configured=false" >> "$GITHUB_OUTPUT"
              if [ "$REQUIRED" = "true" ]; then
                echo "::error title=Promised site is missing::the policy says PAGES_REQUIRED=true and the Pages API reports no site, so the promise is broken"
                echo "The policy promises a published site and the Pages API reports none. This run is red on purpose." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "::notice title=Pages is not enabled::expected, the policy promises no published site. The observatory was built and uploaded as the conformance-evidence artifact. Enable it under Settings, Pages, Source: GitHub Actions."
              echo "Pages configured: false. Deployment not attempted, which the policy expects. The observatory is in the conformance-evidence artifact of this run." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=Pages probe inconclusive::HTTP $code is neither 200 nor 404, so the publish decision cannot be made from a measurement"
              exit 1
              ;;
          esac

  deploy:
    name: publish the observatory
    needs: [conformance, readme-claims, pages-preflight]
    if: needs.pages-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
